<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anime RPC</title>
  </head>
  <body>
    <div class="app">
      <!-- home -->
      <section id="screen-home" class="screen is-active" data-screen="home">
        <div class="broadcast">
          <div class="scanlines" aria-hidden="true"></div>

          <div class="frame" id="frame">
            <img id="cover" alt="" />

            <div class="no-signal" id="no-signal">
              <div class="static-bars" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
              </div>
              <p class="no-signal-label">NO SIGNAL</p>
            </div>

            <div class="rec-badge" id="rec-badge">
              <span class="rec-dot" id="rec-dot"></span>
              <span id="rec-label">REC</span>
            </div>
          </div>

          <div class="now-playing">
            <p class="channel-tag">NOW WATCHING</p>
            <h1 id="title">Nothing playing</h1>
            <p class="episode-tag" id="episode"></p>
          </div>
        </div>
      </section>

      <!-- settings -->
      <section id="screen-settings" class="screen" data-screen="settings">
        <header class="screen-header">
          <h2>Settings</h2>
        </header>

        <div class="settings-list">
          <div class="settings-row">
            <div class="row-text">
              <p class="row-title">Send status to Discord</p>
              <p class="row-sub">Turn off to pause updates without closing the app</p>
            </div>
            <button
              type="button"
              class="switch"
              id="rpc-toggle"
              role="switch"
              aria-checked="true"
              aria-label="Send status to Discord"
            >
              <span class="switch-knob"></span>
            </button>
          </div>

          <button type="button" class="settings-row settings-row--action" id="open-logs">
            <div class="row-text">
              <p class="row-title">View logs</p>
              <p class="row-sub">Connection and activity history</p>
            </div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>

        <footer class="app-footer">
          <span>Anime Discord RPC</span>
          <span id="app-version">v&mdash;</span>
        </footer>
      </section>

      <!-- logs -->
      <section id="screen-logs" class="screen screen--overlay" data-screen="logs">
        <header class="screen-header screen-header--logs">
          <button type="button" class="icon-btn" id="back-from-logs" aria-label="Back to settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <h2>Logs</h2>
          <button type="button" class="text-btn" id="clear-logs">Clear</button>
        </header>
        <p class="logs-hint">Tap a line to copy it</p>
        <div id="log-container" class="log-container"></div>
      </section>

      <nav class="bottom-nav" id="bottom-nav">
        <button type="button" class="nav-btn is-active" data-target="home" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
            <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
          <span>Home</span>
        </button>
        <button type="button" class="nav-btn" data-target="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
